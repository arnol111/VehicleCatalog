name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # La solución incluye el cliente MAUI (Android/iOS/Windows), que no se compila
      # en Linux. Este job apunta a los proyectos del servidor y a sus tests.
      - name: Restaurar dependencias
        run: |
          dotnet restore test/testAPI/testAPI.csproj
          dotnet restore tests/VehicleCatalog.Web.Tests/VehicleCatalog.Web.Tests.csproj

      - name: Compilar
        run: |
          dotnet build test/testAPI/testAPI.csproj --no-restore --configuration Release
          dotnet build tests/VehicleCatalog.Web.Tests/VehicleCatalog.Web.Tests.csproj --no-restore --configuration Release

      - name: Ejecutar tests
        run: |
          dotnet test test/testAPI/testAPI.csproj --no-build --configuration Release --filter "Category=Unit" --verbosity normal
          dotnet test tests/VehicleCatalog.Web.Tests/VehicleCatalog.Web.Tests.csproj --no-build --configuration Release --filter "Category=Unit" --verbosity normal
